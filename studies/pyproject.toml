[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krl-studies"
version = "0.1.0"
description = "Benchmark study framework for krl PET deconvolution methods"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.7",
    "nibabel>=3.0",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["krl_studies*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
markers = [
    "sirf: tests requiring SIRF (run inside the sirf container via make study-sirf-test)",
    "brainweb: tests requiring brainweb package and network download",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # lazy sirf imports guarded in simulation/_api.py
    "F841",  # captured intermediate results in tests
]
