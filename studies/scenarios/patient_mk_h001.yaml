# MK-H001 demonstration: no ground truth; convergence + artefacts only.
# Patient native path is pure CIL (no SIRF simulation): observed = PET.nii.gz,
# guidance = T1.nii.gz, optional ROIs.nii.gz for BV/VOIs; no ground truth so
# metrics carry objective (+ bv when ROIs present) and omit nrmse/crc.
study: patient
dataset:
  kind: patient
  subject_id: MK-H001
  root: data/patients
inputs:
  - kind: native
methods:
  - name: rl
    params: {fwhm_mm: 4.5, iterations: 20}
  - name: krl
    params: {fwhm_mm: 4.5, iterations: 20, num_neighbours: 9, sigma_anat: 0.2}
output: results/patient_demo
