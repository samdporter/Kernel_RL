[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cil-krl"
version = "0.2.0"
description = "Kernelised Richardson-Lucy deconvolution for PET with anatomical guidance, built as a CIL plugin"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kjell Erlandsson", email = "kjell.erlandsson@kcl.ac.uk"},
]
keywords = [
    "PET",
    "deconvolution",
    "Richardson-Lucy",
    "CIL",
    "medical imaging",
    "image reconstruction",
    "kernel methods",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# NOTE: CIL is a runtime requirement but is not pip-installable from PyPI.
# Install CIL first (conda: `conda install -c conda-forge -c ccpi cil`),
# then `pip install cil-krl`.
dependencies = [
    "numpy>=1.23",
    "scipy>=1.7",
    "nibabel>=3.0",
    "numba>=0.55",
]

[project.optional-dependencies]
gpu = [
    "torch>=1.9",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "ruff>=0.4",
]
all = [
    "cil-krl[gpu,dev]",
]

[project.urls]
Homepage = "https://github.com/KCL-BMEIS/KRL"
Repository = "https://github.com/KCL-BMEIS/KRL"
Issues = "https://github.com/KCL-BMEIS/KRL/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["krl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
markers = [
    "gpu: tests requiring an NVIDIA GPU with CUDA (deselected by default)",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # torch-guarded imports in the GPU operator module
    "F841",  # captured intermediate results in tests
]
