name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "v${version}" ]; then
            echo "Tag $TAG does not match pyproject.toml version ${version}" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    # PyPI publishing is opt-in via the PUBLISH_TO_PYPI repository variable (unset/false = not published)
    if: vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (configure the PyPI project first)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
